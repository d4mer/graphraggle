name: worker
version: "1.0"
description: >-
  Worker seat. Takes implementation and testing tasks handed down by the lead,
  does the work, runs the tests, and hands the result back. Never pushes to
  GitHub on its own.

defaults:
  runtime: pi

profiles:
  default:
    summary: Standard operations profile.
    uses:
      skills: []
      guidance: [role]
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
      applies_on: [fresh_start]
  actions: []
